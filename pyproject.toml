[project]
name = "park"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "pandas>=2.2.3",
    "psutil>=7.0.0",
    "pyarrow>=20.0.0",
]

[project.scripts]
park = "park.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["park"]

[tool.hatch.build.targets.sdist]
include = ["park"]

[tool.hatch.build.targets.wheel]
include = ["park"]


